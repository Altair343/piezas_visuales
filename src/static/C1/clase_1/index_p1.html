<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .canvas{
            border: 1px red solid;
        }
    </style>
    <canvas width="700" height="700" class="canvas"></canvas>
    <script>
        // Ejemplo 2
        let canvas =document.querySelector('canvas');
        let context = canvas.getContext('2d');
        context.fillStyle = 'blue';
        context.fillRect(100,100,400,400);

        // Ejemplo 3
        context.lineWidth = 4;
        context.beginPath();
        context.rect(80,80,380,380);
        context.stroke();

        // Ejemplo 4
        context.beginPath();
        context.arc(300,300,50,0,Math.PI * 2);
        context.stroke();

        // Ejemplo 1
        let year = 2042;
        let dinner = "salad"
        let sentence = `In the year ${year} I will eat ${dinner}`;

        function saySomething(param){
            console.log(param);
        }
        saySomething(sentence);

        function add(numer_1, number_2){
            return numer_1 + number_2;
        }

        let result = add(5,7);
        console.log(result);

        let multiply = (number_1, number_2) => number_1 * number_2;
        console.log(multiply(5,7));

    </script>
</body>
</html>
